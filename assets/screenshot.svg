<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <rect width="720" height="240" rx="12" fill="#0d1117"/>
  <rect x="16" y="16" width="688" height="40" rx="8" fill="#161b22"/>
  <text x="32" y="42" font-family="monospace" font-size="16" fill="#e6edf3">$ pswatch -c config.toml</text>
  <text x="32" y="92" font-family="monospace" font-size="16" fill="#e6edf3">INFO: watching for processes (interval: 5s)</text>
